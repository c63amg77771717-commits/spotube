name: EvanTube Build26 Trigger Probe
on:
  push:
    branches:
      - codex/ios-neonoir-20260930
    paths:
      - .github/workflows/evantube-build26-trigger-probe.yml
permissions:
  contents: read
jobs:
  offline-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify existing pinned input and workflow boundaries
        run: python3 scripts/ios-public-ci/boundary.py preflight
      - name: Verify synthetic policy regressions without network playback
        run: |
          python3 scripts/ios-public-ci/boundary_tests.py
          python3 scripts/ios-public-ci/ipa_policy_tests.py
