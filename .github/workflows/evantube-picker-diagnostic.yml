name: EvanTube lyric picker diagnostics
on:
  push:
    branches: [codex/ios-neonoir-20260930]
    paths:
      - '.github/workflows/evantube-picker-diagnostic.yml'
      - 'scripts/ios-picker-diagnostic/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: evantube-picker-diagnostic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  picker:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'
      - name: Add evidence to existing test without changing assertions
        env:
          EVANTUBE_PICKER_EVIDENCE: ${{ runner.temp }}/evantube-picker-evidence
        run: |
          echo "EVANTUBE_PICKER_EVIDENCE=$EVANTUBE_PICKER_EVIDENCE" >> "$GITHUB_ENV"
          python3 scripts/ios-picker-diagnostic/prepare.py --repo "$GITHUB_WORKSPACE" --evidence "$EVANTUBE_PICKER_EVIDENCE"
      - name: Generate existing native project
        working-directory: native-ios
        run: |
          brew install xcodegen
          xcodegen generate
          python3 - <<'PY'
          import os, pathlib, plistlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'evantube-picker.entitlements'
          p.write_bytes(plistlib.dumps({'application-identifier':'com.c63amg77771717.evantube','keychain-access-groups':['com.c63amg77771717.evantube'],'get-task-allow':True}))
          PY
      - name: Run actual candidate hit-testing and selection assertion
        working-directory: native-ios
        run: |
          simulator_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for g in json.load(sys.stdin)["devices"].values() for d in g if d["name"] == "iPhone 16 Pro" and d.get("isAvailable", False)))')
          xcrun simctl bootstatus "$simulator_id" -b
          set -o pipefail
          xcodebuild -project LovelyMusic.xcodeproj -scheme LovelyMusicUITests -configuration Debug \
            -destination "platform=iOS Simulator,id=$simulator_id" -parallel-testing-enabled NO \
            -only-testing:LovelyMusicUITests/EvanTubeLyricsCandidateUITests/testCandidateOnlyResultReachesFullPlayerAndAllowsPlainLyricsSelection \
            -resultBundlePath "$RUNNER_TEMP/evantube-picker.xcresult" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- \
            CODE_SIGN_ENTITLEMENTS="$RUNNER_TEMP/evantube-picker.entitlements" test \
            2>&1 | tee "$EVANTUBE_PICKER_EVIDENCE/xcodebuild.log"
      - name: Export valid failure evidence independently
        if: always()
        run: python3 scripts/ios-picker-diagnostic/export_results.py --results-root "$RUNNER_TEMP" --evidence "$EVANTUBE_PICKER_EVIDENCE"
      - name: Save compact diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EvanTube-build19-picker-diagnostic
          path: |
            ${{ runner.temp }}/evantube-picker-evidence/**/*.png
            ${{ runner.temp }}/evantube-picker-evidence/**/*.txt
            ${{ runner.temp }}/evantube-picker-evidence/**/*.json
            ${{ runner.temp }}/evantube-picker-evidence/**/*.log
          if-no-files-found: error
          retention-days: 30
      - name: Preserve original result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EvanTube-build19-picker-xcresult
          path: ${{ runner.temp }}/evantube-picker.xcresult
          if-no-files-found: warn
          retention-days: 30
