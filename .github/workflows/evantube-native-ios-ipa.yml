name: EvanTube native iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - codex/ios-neonoir-20260930
    paths:
      - native-ios/**
      - .github/workflows/evantube-native-ios-ipa.yml

concurrency:
  group: evantube-native-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'
      - name: Verify advertising SDK removal
        run: python3 native-ios/scripts/check_no_ads.py
      - name: Test personalized recommendation policy
        run: |
          swiftc -parse-as-library native-ios/LovelyMusic/Domain/Entities/Song.swift native-ios/LovelyMusic/Domain/Entities/PersonalMusicTaste.swift native-ios/RecommendationChecks/RecommendationPolicyChecks.swift -o "$RUNNER_TEMP/recommendation-checks"
          "$RUNNER_TEMP/recommendation-checks"
      - name: Generate project
        working-directory: native-ios
        env:
          YOUTUBE_DATA_API_KEY: ${{ secrets.EVANTUBE_YOUTUBE_DATA_API_KEY }}
        run: |
          brew install xcodegen
          cp Secrets.plist.example LovelyMusic/Resources/Secrets.plist
          python3 - <<'PY'
          import os, plistlib
          from pathlib import Path
          path = Path('LovelyMusic/Resources/Secrets.plist')
          data = plistlib.loads(path.read_bytes())
          key = os.environ.get('YOUTUBE_DATA_API_KEY', '').strip()
          if key:
              data['YOUTUBE_DATA_API_KEY'] = key
              path.write_bytes(plistlib.dumps(data))
          print('Official YouTube search configured:', bool(key))
          PY
          xcodegen generate
      - name: Build unsigned iOS app
        working-directory: native-ios
        run: |
          xcodebuild \
            -project LovelyMusic.xcodeproj \
            -scheme LovelyMusic \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/evantube-derived" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Test MB3 import and playlist sync
        working-directory: native-ios
        run: |
          # Tests use fixtures and must never spend the production search quota.
          /usr/libexec/PlistBuddy -c 'Delete :YOUTUBE_DATA_API_KEY' LovelyMusic/Resources/Secrets.plist || true
          # The simulator still requires a signed host with Keychain entitlements.
          python3 - <<'PY'
          import os, plistlib
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'evantube-simulator.entitlements'
          path.write_bytes(plistlib.dumps({
              'application-identifier': 'com.c63amg77771717.evantube',
              'keychain-access-groups': ['com.c63amg77771717.evantube'],
              'get-task-allow': True,
          }))
          PY
          xcodebuild \
            -project LovelyMusic.xcodeproj \
            -scheme EvanTubeTests \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -only-testing:EvanTubeTests \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_ENTITLEMENTS="$RUNNER_TEMP/evantube-simulator.entitlements" \
            test
      - name: Capture Traditional Chinese settings previews
        id: settings_preview
        working-directory: native-ios
        run: |
          xcrun simctl shutdown all
          simulator_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for group in json.load(sys.stdin)["devices"].values() for d in group if d["name"] == "iPhone 16 Pro" and d.get("isAvailable", False)))')
          xcrun simctl bootstatus "$simulator_id" -b
          mkdir -p "$RUNNER_TEMP/evantube-ui-diagnostics"
          (
            while sleep 60; do
              app_pid=$(pgrep -x LovelyMusic | head -n 1 || true)
              if [ -n "$app_pid" ]; then
                sample "$app_pid" 2 -file "$RUNNER_TEMP/evantube-ui-diagnostics/sample-$(date +%s).txt" >/dev/null 2>&1 || true
              fi
            done
          ) &
          sampler_pid=$!
          trap 'kill "$sampler_pid" 2>/dev/null || true' EXIT
          xcodebuild \
            -project LovelyMusic.xcodeproj \
            -scheme LovelyMusicUITests \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -only-testing:LovelyMusicUITests/EvanTubeSettingsPreviewTests \
            -resultBundlePath "$RUNNER_TEMP/evantube-previews.xcresult" \
            -retry-tests-on-failure \
            -test-iterations 2 \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_ENTITLEMENTS="$RUNNER_TEMP/evantube-simulator.entitlements" \
            test
      - name: Export settings preview attachments
        if: always() && steps.settings_preview.outcome != 'skipped'
        run: |
          xcrun xcresulttool export attachments \
            --path "$RUNNER_TEMP/evantube-previews.xcresult" \
            --output-path "$RUNNER_TEMP/evantube-previews"
      - uses: actions/upload-artifact@v4
        if: always() && steps.settings_preview.outcome != 'skipped'
        with:
          name: EvanTube-settings-previews
          path: |
            ${{ runner.temp }}/evantube-previews
            ${{ runner.temp }}/evantube-ui-diagnostics
            native-ios/LovelyMusic.xcodeproj/project.pbxproj
          if-no-files-found: error
      - name: Package IPA
        if: success()
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/evantube-derived/Build/Products/Release-iphoneos/LovelyMusic.app" "$RUNNER_TEMP/Payload/EvanTube.app"
          cd "$RUNNER_TEMP"
          ditto -c -k --sequesterRsrc --keepParent Payload "$GITHUB_WORKSPACE/EvanTube-native-iOS.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: EvanTube-native-iOS-unsigned
          path: EvanTube-native-iOS.ipa
          if-no-files-found: error
