name: EvanTube Build37 focused settings UI regression

on:
  push:
    branches:
      - codex/evantube-build37-anonymous-repair-20261021
    paths:
      - native-ios/**
      - .github/workflows/evantube-build37-focused.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: evantube-build37-focused-${{ github.ref }}
  cancel-in-progress: true

jobs:
  settings-navigation-ui:
    runs-on: macos-14
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'
      - name: Prepare isolated signed simulator fixture
        working-directory: native-ios
        run: |
          brew install xcodegen
          python3 - <<'PY'
          import pathlib, plistlib, os
          pathlib.Path('LovelyMusic/Resources/Secrets.plist').write_bytes(plistlib.dumps({}))
          pathlib.Path(os.environ['RUNNER_TEMP'], 'build37-ui-simulator.entitlements').write_bytes(plistlib.dumps({
              'application-identifier': 'com.c63amg77771717.evantube',
              'keychain-access-groups': ['com.c63amg77771717.evantube'],
              'get-task-allow': True,
          }))
          PY
          xcodegen generate
      - name: Run failed settings tap regression
        working-directory: native-ios
        run: |
          set -o pipefail
          xcodebuild \
            -project LovelyMusic.xcodeproj \
            -scheme LovelyMusicUITests \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -parallel-testing-enabled NO \
            -only-testing:LovelyMusicUITests/SettingsTapRegressionUITests/testThreeSettingsEntrypointsAreTappableFromCardRightSide \
            -resultBundlePath "$RUNNER_TEMP/build37-focused-settings.xcresult" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- \
            CODE_SIGN_ENTITLEMENTS="$RUNNER_TEMP/build37-ui-simulator.entitlements" test \
            2>&1 | tee "$RUNNER_TEMP/build37-focused-settings.log"
      - name: Publish readable focused settings result
        if: always()
        run: |
          python3 - <<'PY'
          import os, pathlib
          file = pathlib.Path(os.environ['RUNNER_TEMP'], 'build37-focused-settings.log')
          lines = file.read_text(errors='replace').splitlines() if file.exists() else []
          for line in lines:
              if ' error: ' in line or 'XCTAssert' in line:
                  print('::error::' + line[:1600].replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
              if 'Executed ' in line or 'Test Suite ' in line:
                  print(line)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EvanTube-Build37-focused-settings-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/build37-focused-settings.log
            ${{ runner.temp }}/build37-focused-settings.xcresult
          if-no-files-found: error
          retention-days: 7
