name: EvanTube Build36 focused playback regression

on:
  push:
    branches:
      - codex/evantube-build36-background-playback-20261021
    paths:
      - native-ios/**
      - .github/workflows/evantube-build36-focused.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: evantube-build36-focused-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playback-regression:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'
      - name: Generate isolated Build36 regression target
        working-directory: native-ios
        run: |
          brew install xcodegen
          python3 - <<'PY'
          import pathlib, plistlib, os
          pathlib.Path('LovelyMusic/Resources/Secrets.plist').write_bytes(plistlib.dumps({}))
          spec=pathlib.Path('project.yml')
          data=spec.read_text()
          old='      - path: LovelyMusicTests'+chr(10)
          assert data.count(old)==1
          files=[
              'LovelyMusicTests/Core/Audio/Build36BackgroundPlaybackTests.swift',
              'LovelyMusicTests/Core/Audio/AudioEngineLoadAndPlayTests.swift',
              'LovelyMusicTests/Data/PlayerRepositorySingleFlightTests.swift',
              'LovelyMusicTests/Data/AnonymousPlaybackFallbackTests.swift',
              'LovelyMusicTests/Data/KeylessOnlineSearchTests.swift',
              'LovelyMusicTests/Mocks/MockInnerTubeRepository.swift',
              'LovelyMusicTests/Mocks/MockPlaylistRepository.swift',
              'LovelyMusicTests/Mocks/MockFavoritesRepository.swift',
          ]
          new=''.join('      - path: '+f+chr(10) for f in files)
          spec.write_text(data.replace(old,new))
          pathlib.Path(os.environ['RUNNER_TEMP'],'build36-simulator.entitlements').write_bytes(plistlib.dumps({
              'application-identifier':'com.c63amg77771717.evantube',
              'keychain-access-groups':['com.c63amg77771717.evantube'],
              'get-task-allow':True,
          }))
          PY
          xcodegen generate
      - name: Run only Build36 transfer and background navigation tests
        working-directory: native-ios
        run: |
          xcodebuild \
            -project LovelyMusic.xcodeproj \
            -scheme LovelyMusicTests \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -parallel-testing-enabled NO \
            -only-testing:LovelyMusicTests/Build36AudioProbeTests \
            -only-testing:LovelyMusicTests/Build36BackgroundSkipTests \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- \
            CODE_SIGN_ENTITLEMENTS="$RUNNER_TEMP/build36-simulator.entitlements" test
