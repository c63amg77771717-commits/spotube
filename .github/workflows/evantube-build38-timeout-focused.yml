name: EvanTube Build38 timeout focused regression

on:
  push:
    branches:
      - codex/evantube-build38-cdn-range-20261022
    paths:
      - .github/workflows/evantube-build38-timeout-focused.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: evantube-build38-unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  timeout-focused:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Prepare focused test project
        working-directory: native-ios
        run: |
          brew install xcodegen
          python3 - <<'PY'
          import pathlib, plistlib, os
          pathlib.Path('LovelyMusic/Resources/Secrets.plist').write_bytes(plistlib.dumps({}))
          pathlib.Path(os.environ['RUNNER_TEMP'], 'build38-focused.entitlements').write_bytes(plistlib.dumps({
              'application-identifier': 'com.c63amg77771717.evantube',
              'keychain-access-groups': ['com.c63amg77771717.evantube'],
              'get-task-allow': True,
          }))
          PY
          xcodegen generate

      - name: Run timeout diagnostic regression only
        working-directory: native-ios
        run: |
          set -o pipefail
          xcodebuild             -project LovelyMusic.xcodeproj             -scheme LovelyMusicTests             -configuration Debug             -destination 'platform=iOS Simulator,name=iPhone 16 Pro'             -parallel-testing-enabled NO             -only-testing:LovelyMusicTests/Build36AudioProbeTests/testFullDownloadTimeoutDoesNotReuseSuccessfulProbeStatusOrBytes             -resultBundlePath "$RUNNER_TEMP/build38-timeout-focused.xcresult"             CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=-             CODE_SIGN_ENTITLEMENTS="$RUNNER_TEMP/build38-focused.entitlements" test             2>&1 | tee "$RUNNER_TEMP/build38-timeout-focused.log"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EvanTube-Build38-timeout-focused-${{ github.sha }}
          path: |
            ${{ runner.temp }}/build38-timeout-focused.log
            ${{ runner.temp }}/build38-timeout-focused.xcresult
          if-no-files-found: error
          retention-days: 7
