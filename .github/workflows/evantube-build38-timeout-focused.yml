name: EvanTube Build38 focused timeout regression

on:
  push:
    branches:
      - codex/evantube-build38-timeout-fixture-20261022
    paths:
      - native-ios/**
      - .github/workflows/evantube-build38-timeout-focused.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: evantube-build38-timeout-focused-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audio-regression:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'
      - name: Generate isolated synthetic regression target
        working-directory: native-ios
        run: |
          brew install xcodegen
          python3 - <<'PY'
          import pathlib, plistlib, os
          pathlib.Path('LovelyMusic/Resources/Secrets.plist').write_bytes(plistlib.dumps({}))
          spec = pathlib.Path('project.yml')
          data = spec.read_text()
          old = '      - path: LovelyMusicTests' + chr(10)
          assert data.count(old) == 1
          new = (
              '      - path: LovelyMusicTests/Core/Audio/AudioEngineLoadAndPlayTests.swift' + chr(10) +
              '      - path: LovelyMusicTests/Data/PlayerRepositorySingleFlightTests.swift' + chr(10) +
              '      - path: LovelyMusicTests/Data/KeylessOnlineSearchTests.swift' + chr(10) +
              '      - path: LovelyMusicTests/Data/AnonymousPlaybackFallbackTests.swift' + chr(10) +
              '      - path: LovelyMusicTests/Data/Build37AnonymousSourceSelectionTests.swift' + chr(10) +
              '      - path: LovelyMusicTests/InnerTube/InnerTubePlayerSessionTests.swift' + chr(10) +
              '      - path: LovelyMusicTests/InnerTube/InnerTubeVisitorDataTests.swift' + chr(10) +
              '      - path: LovelyMusicTests/InnerTube/InnerTubeVisitorDataExtraTests.swift' + chr(10) +
              '      - path: LovelyMusicTests/Core/Audio/Build37GuestPlaybackIntegrationTests.swift' + chr(10) +
              '      - path: LovelyMusicTests/Data/MediaCandidateRecoveryTests.swift' + chr(10) +
              '      - path: LovelyMusicTests/Core/Audio/Build36BackgroundPlaybackTests.swift' + chr(10) +
              '      - path: LovelyMusicTests/Mocks/MockInnerTubeRepository.swift' + chr(10) +
              '      - path: LovelyMusicTests/Mocks/MockPlaylistRepository.swift' + chr(10) +
              '      - path: LovelyMusicTests/Mocks/MockFavoritesRepository.swift' + chr(10)
          )
          spec.write_text(data.replace(old, new))
          pathlib.Path(os.environ['RUNNER_TEMP'], 'build38-simulator.entitlements').write_bytes(plistlib.dumps({
              'application-identifier': 'com.c63amg77771717.evantube',
              'keychain-access-groups': ['com.c63amg77771717.evantube'],
              'get-task-allow': True,
          }))
          PY
          xcodegen generate
      - name: Verify full-download timeout diagnostic only
        working-directory: native-ios
        run: |
          set -o pipefail
          xcodebuild \
            -project LovelyMusic.xcodeproj \
            -scheme LovelyMusicTests \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -parallel-testing-enabled NO \
            -only-testing:LovelyMusicTests/Build36AudioProbeTests/testFullDownloadTimeoutDoesNotReuseSuccessfulProbeStatusOrBytes \
            -resultBundlePath "$RUNNER_TEMP/build38-audio.xcresult" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- \
            CODE_SIGN_ENTITLEMENTS="$RUNNER_TEMP/build38-simulator.entitlements" test \
            2>&1 | tee "$RUNNER_TEMP/build38-audio.log"
      - name: Publish readable audio result
        if: always()
        run: |
          python3 - <<'PY'
          import os, pathlib
          file = pathlib.Path(os.environ['RUNNER_TEMP'], 'build38-audio.log')
          lines = file.read_text(errors='replace').splitlines() if file.exists() else []
          for line in lines:
              if ' error: ' in line or 'XCTAssert' in line:
                  print('::error::' + line[:1600].replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
              if 'Executed ' in line or 'Test Suite ' in line:
                  print(line)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EvanTube-Build38-audio-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/build38-audio.log
            ${{ runner.temp }}/build38-audio.xcresult
          if-no-files-found: error
          retention-days: 7

