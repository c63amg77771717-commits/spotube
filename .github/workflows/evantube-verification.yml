name: EvanTube verification (playback start + live lyrics)

# Runs before any IPA is handed over: real AVPlayer playback start through the
# progressive path, and the production lyric chain against 30 playlist songs.
on:
  push:
    branches:
      - 'codex/evantube-check-*'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: evantube-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'
      - name: Generate verification target
        working-directory: native-ios
        run: |
          brew install xcodegen
          python3 - <<'PY'
          import pathlib, plistlib, os
          pathlib.Path('LovelyMusic/Resources/Secrets.plist').write_bytes(plistlib.dumps({}))
          spec = pathlib.Path('project.yml')
          data = spec.read_text()
          old = '      - path: LovelyMusicTests' + chr(10)
          assert data.count(old) == 1
          new = (
              '      - path: LovelyMusicTests/Core/Audio/ProgressiveStartIntegrationTests.swift' + chr(10) +
              '      - path: LovelyMusicTests/Data/LiveLyricsEvaluationTests.swift' + chr(10) +
              '      - path: LovelyMusicTests/Mocks/MockInnerTubeRepository.swift' + chr(10) +
              '      - path: LovelyMusicTests/Mocks/MockPlaylistRepository.swift' + chr(10) +
              '      - path: LovelyMusicTests/Mocks/MockFavoritesRepository.swift' + chr(10)
          )
          spec.write_text(data.replace(old, new))
          pathlib.Path(os.environ['RUNNER_TEMP'], 'verify-simulator.entitlements').write_bytes(plistlib.dumps({
              'application-identifier': 'com.c63amg77771717.evantube',
              'keychain-access-groups': ['com.c63amg77771717.evantube'],
              'get-task-allow': True,
          }))
          PY
          xcodegen generate
      - name: Playback start and live lyrics
        working-directory: native-ios
        env:
          TEST_RUNNER_EVANTUBE_LIVE_LYRICS: '1'
        run: |
          set -o pipefail
          xcodebuild \
            -project LovelyMusic.xcodeproj \
            -scheme LovelyMusicTests \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -parallel-testing-enabled NO \
            -only-testing:LovelyMusicTests/ProgressiveStartIntegrationTests \
            -only-testing:LovelyMusicTests/LiveLyricsEvaluationTests \
            -resultBundlePath "$RUNNER_TEMP/verify.xcresult" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- \
            CODE_SIGN_ENTITLEMENTS="$RUNNER_TEMP/verify-simulator.entitlements" test \
            2>&1 | tee "$RUNNER_TEMP/verify.log"
      - name: Publish results
        if: always()
        run: |
          grep -E 'LIVE-LYRICS|error: |Test Case .*(passed|failed)|Executed ' "$RUNNER_TEMP/verify.log" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EvanTube-verification-${{ github.sha }}
          path: |
            ${{ runner.temp }}/verify.log
            ${{ runner.temp }}/verify.xcresult
          if-no-files-found: error
          retention-days: 7
