name: EvanTube Build36 focused settings UI repair

on:
  push:
    branches:
      - codex/evantube-build36-background-playback-20261021
    paths:
      - .github/workflows/evantube-build36-ui-repair.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: evantube-build36-ui-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  settings-navigation-ui:
    runs-on: macos-14
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'
      - name: Prepare isolated signed simulator fixture
        working-directory: native-ios
        run: |
          brew install xcodegen
          python3 - <<'PY'
          import pathlib, plistlib, os
          pathlib.Path('LovelyMusic/Resources/Secrets.plist').write_bytes(plistlib.dumps({}))
          pathlib.Path(os.environ['RUNNER_TEMP'], 'build36-ui-simulator.entitlements').write_bytes(plistlib.dumps({
              'application-identifier': 'com.c63amg77771717.evantube',
              'keychain-access-groups': ['com.c63amg77771717.evantube'],
              'get-task-allow': True,
          }))
          PY
          xcodegen generate
      - name: Validate full-card taps for YouTube, import, and Drive sheets
        working-directory: native-ios
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/evantube-build36-ui-repair"
          xcodebuild \
            -project LovelyMusic.xcodeproj \
            -scheme LovelyMusicUITests \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -parallel-testing-enabled NO \
            -only-testing:LovelyMusicUITests/SettingsTapRegressionUITests \
            -resultBundlePath "$RUNNER_TEMP/evantube-build36-ui-repair/settings-navigation.xcresult" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- \
            CODE_SIGN_ENTITLEMENTS="$RUNNER_TEMP/build36-ui-simulator.entitlements" test \
            2>&1 | tee "$RUNNER_TEMP/evantube-build36-ui-repair/xcodebuild.log"
      - name: Preserve readable UI failure evidence
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          out = pathlib.Path(os.environ['RUNNER_TEMP'], 'evantube-build36-ui-repair')
          out.mkdir(exist_ok=True)
          log = out / 'xcodebuild.log'
          lines = log.read_text(errors='replace').splitlines() if log.exists() else []
          pattern = re.compile(r'error:|XCTAssert|Test Case .*failed|Testing failed:|TEST FAILED|Failed to|failed to', re.I)
          indexes = set(range(max(0, len(lines) - 120), len(lines)))
          for i, line in enumerate(lines):
              if pattern.search(line):
                  indexes.update(range(max(0, i - 2), min(len(lines), i + 4)))
          excerpt = '\n'.join(f'{i + 1}: {lines[i][:1600]}' for i in sorted(indexes))
          (out / 'failure-excerpt.txt').write_text(excerpt + '\n')
          (out / 'source.json').write_text(json.dumps({
              'sourceSHA': os.environ['GITHUB_SHA'],
              'runID': os.environ['GITHUB_RUN_ID'],
              'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'testSelection': 'LovelyMusicUITests/SettingsTapRegressionUITests',
              'logCaptured': log.exists(),
          }, indent=2) + '\n')
          # Keep the original xcodebuild result authoritative. This step only
          # preserves evidence; it neither reruns nor masks a failed test.
          for line in lines:
              if ' error: ' in line or 'XCTAssert' in line:
                  message = line[:1600].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::error::' + message)
          print(excerpt[-24000:])
          PY
      - name: Upload focused UI test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EvanTube-Build36-settings-ui-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/evantube-build36-ui-repair
          if-no-files-found: error
          retention-days: 7
