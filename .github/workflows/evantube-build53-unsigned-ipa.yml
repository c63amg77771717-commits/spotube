name: EvanTube Build53 unsigned IPA

"on":
  repository_dispatch:
    types: [build53-ipa]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: evantube-build53-unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audio-regression:
    runs-on: macos-15-intel
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/build49-lyric-sweep-4b36
          persist-credentials: false
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - name: Generate isolated synthetic regression target
        working-directory: native-ios
        run: |
          brew install xcodegen
          python3 - <<'PY'
          import pathlib, plistlib, os
          pathlib.Path('LovelyMusic/Resources/Secrets.plist').write_bytes(plistlib.dumps({}))
          spec = pathlib.Path('project.yml')
          data = spec.read_text()
          old = '      - path: LovelyMusicTests' + chr(10)
          assert data.count(old) == 1
          new = (
              '      - path: LovelyMusicTests/Core/Audio/AudioEngineLoadAndPlayTests.swift' + chr(10) +
              '      - path: LovelyMusicTests/Core/Audio/Streaming/SegmentedAudioStreamTests.swift' + chr(10) +
              '      - path: LovelyMusicTests/Domain/StreamingDataTests.swift' + chr(10) +
              '      - path: LovelyMusicTests/Data/YouTubeMusicLyricsTests.swift' + chr(10) +
              '      - path: LovelyMusicTests/Data/YouTubeTitleParserTests.swift' + chr(10) +
              '      - path: LovelyMusicTests/Data/OfficialAudioCatalogTests.swift' + chr(10) +
              '      - path: LovelyMusicTests/Core/Audio/ProgressiveStartIntegrationTests.swift' + chr(10) +
              '      - path: LovelyMusicTests/Core/Audio/OfficialAudioPlaybackTests.swift' + chr(10) +
              '      - path: LovelyMusicTests/Data/PlayerRepositorySingleFlightTests.swift' + chr(10) +
              '      - path: LovelyMusicTests/Data/KeylessOnlineSearchTests.swift' + chr(10) +
              '      - path: LovelyMusicTests/Data/AnonymousPlaybackFallbackTests.swift' + chr(10) +
              '      - path: LovelyMusicTests/Data/Build37AnonymousSourceSelectionTests.swift' + chr(10) +
              '      - path: LovelyMusicTests/InnerTube/InnerTubePlayerSessionTests.swift' + chr(10) +
              '      - path: LovelyMusicTests/InnerTube/InnerTubeVisitorDataTests.swift' + chr(10) +
              '      - path: LovelyMusicTests/InnerTube/InnerTubeVisitorDataExtraTests.swift' + chr(10) +
              '      - path: LovelyMusicTests/Core/Audio/Build37GuestPlaybackIntegrationTests.swift' + chr(10) +
              '      - path: LovelyMusicTests/Data/MediaCandidateRecoveryTests.swift' + chr(10) +
              '      - path: LovelyMusicTests/Core/Audio/Build36BackgroundPlaybackTests.swift' + chr(10) +
              '      - path: LovelyMusicTests/Data/Build46LyricSyncTests.swift' + chr(10) +
              '      - path: LovelyMusicTests/Core/Audio/Build46StartTimeTests.swift' + chr(10) +
              '      - path: LovelyMusicTests/Core/Audio/Build47ResumeTests.swift' + chr(10) +
              '      - path: LovelyMusicTests/Core/Audio/Build48PlaybackTests.swift' + chr(10) +
              '      - path: LovelyMusicTests/Core/Audio/Build50PlaybackTests.swift' + chr(10) +
              '      - path: LovelyMusicTests/Core/Audio/Build51ShuffleTests.swift' + chr(10) +
              '      - path: LovelyMusicTests/Core/Audio/Build52PlaybackTests.swift' + chr(10) +
              '      - path: LovelyMusicTests/Core/Audio/Build53PlaybackTests.swift' + chr(10) +
              '      - path: LovelyMusicTests/Core/Audio/Build49PlaybackTests.swift' + chr(10) +
              '      - path: LovelyMusicTests/Mocks/MockInnerTubeRepository.swift' + chr(10) +
              '      - path: LovelyMusicTests/Mocks/MockPlaylistRepository.swift' + chr(10) +
              '      - path: LovelyMusicTests/Mocks/MockFavoritesRepository.swift' + chr(10)
          )
          spec.write_text(data.replace(old, new))
          pathlib.Path(os.environ['RUNNER_TEMP'], 'build53-simulator.entitlements').write_bytes(plistlib.dumps({
              'application-identifier': 'com.c63amg77771717.evantube',
              'keychain-access-groups': ['com.c63amg77771717.evantube'],
              'get-task-allow': True,
          }))
          PY
          xcodegen generate
      - name: Select an installed iOS simulator
        id: simulator
        run: |
          set -euo pipefail
          # macos-15-intel does not ship the iPhone 16 Pro / iOS 18.5 destination
          # that the arm64 image has. xcodebuild then lists only placeholders.
          xcodebuild -runFirstLaunch || true
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          def run(args, check=True):
              result = subprocess.run(args, text=True, capture_output=True)
              if check and result.returncode != 0:
                  print(result.stdout)
                  print(result.stderr)
                  raise SystemExit(result.returncode)
              return result.stdout
          def ios_runtimes():
              data = json.loads(run(["xcrun", "simctl", "list", "runtimes", "-j"]))
              found = [item for item in data.get("runtimes", []) if item.get("isAvailable") and "iOS" in item.get("name", "")]
              def version(item):
                  return [int(part) if part.isdigit() else 0 for part in item.get("version", "0").split(".")]
              found.sort(key=version)
              return found
          print(run(["xcrun", "simctl", "list", "runtimes", "available"], check=False))
          if not ios_runtimes():
              print("No iOS simulator runtime is installed; downloading the iOS platform")
              subprocess.check_call(["xcodebuild", "-downloadPlatform", "iOS"])
          runtimes = ios_runtimes()
          if not runtimes:
              raise SystemExit("no iOS simulator runtime after download")
          devices = json.loads(run(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          print(run(["xcrun", "simctl", "list", "devices", "available"], check=False))
          chosen = None
          for runtime, entries in devices.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for device in entries:
                  if not device.get("isAvailable", True):
                      continue
                  if "iPhone" not in device.get("name", ""):
                      continue
                  chosen = device
                  if device.get("name") == "iPhone 16":
                      break
              if chosen and chosen.get("name") == "iPhone 16":
                  break
          if chosen is None:
              types = json.loads(run(["xcrun", "simctl", "list", "devicetypes", "-j"]))
              iphones = [item for item in types.get("devicetypes", []) if item.get("name", "").startswith("iPhone")]
              preferred = ["iPhone 16", "iPhone 16 Pro", "iPhone 15", "iPhone 15 Pro", "iPhone SE (3rd generation)"]
              iphones.sort(key=lambda item: preferred.index(item["name"]) if item["name"] in preferred else 50)
              if not iphones:
                  raise SystemExit("no iPhone device type")
              created = run(["xcrun", "simctl", "create", "EvanTube iPhone", iphones[0]["identifier"], runtimes[-1]["identifier"]]).strip()
              chosen = {"udid": created, "name": iphones[0]["name"]}
          udid = chosen["udid"]
          name = chosen["name"]
          print(f"Using simulator {name} {udid}")
          subprocess.run(["xcrun", "simctl", "boot", udid], check=False)
          with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a") as handle:
              handle.write(f"udid={udid}\n")
              handle.write(f"name={name}\n")
          PY
      - name: Verify lyric fill, background budget, resume, and audio regressions
        working-directory: native-ios
        run: |
          set -o pipefail
          xcodebuild \
            -project LovelyMusic.xcodeproj \
            -scheme LovelyMusicTests \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -parallel-testing-enabled NO \
            -only-testing:LovelyMusicTests/AudioTransferIntegrityTests \
            -only-testing:LovelyMusicTests/YouTubeCDNRangeRequestTests \
            -only-testing:LovelyMusicTests/SegmentedAudioStreamTests \
            -only-testing:LovelyMusicTests/StreamingDataTests \
            -only-testing:LovelyMusicTests/YouTubeMusicLyricsTests \
            -only-testing:LovelyMusicTests/YouTubeTitleParserTests \
            -only-testing:LovelyMusicTests/OfficialAudioCatalogTests \
            -only-testing:LovelyMusicTests/ProgressiveStartIntegrationTests \
            -only-testing:LovelyMusicTests/OfficialAudioPlaybackTests \
            -only-testing:LovelyMusicTests/KeylessOnlineSearchTests \
            -only-testing:LovelyMusicTests/AnonymousPlaybackFallbackTests \
            -only-testing:LovelyMusicTests/Build37AnonymousSourceSelectionTests \
            -only-testing:LovelyMusicTests/InnerTubePlayerSessionTests \
            -only-testing:LovelyMusicTests/InnerTubeVisitorDataTests \
            -only-testing:LovelyMusicTests/InnerTubeVisitorDataExtraTests \
            -only-testing:LovelyMusicTests/Build37GuestPlaybackIntegrationTests \
            -only-testing:LovelyMusicTests/Build36AudioProbeTests \
            -only-testing:LovelyMusicTests/Build36BackgroundSkipTests \
            -only-testing:LovelyMusicTests/MediaCandidateRecoveryTests \
            -only-testing:LovelyMusicTests/PlayerRepositorySingleFlightTests/testVisionOSPrefersFullAdaptiveAACOverShortHLSWindow \
            -only-testing:LovelyMusicTests/PlayerRepositorySingleFlightTests/testVisionOSUsesHLSOnlyWhenNoValidAACExists \
            -only-testing:LovelyMusicTests/PlayerRepositorySingleFlightTests/testSessionHTTP400IsSkippedUntilSessionChanges \
            -only-testing:LovelyMusicTests/Build46LyricSyncTests \
            -only-testing:LovelyMusicTests/Build46StartTimeTests \
            -only-testing:LovelyMusicTests/Build47ResumeTests \
            -only-testing:LovelyMusicTests/Build48PlaybackTests \
            -only-testing:LovelyMusicTests/Build50PlaybackTests \
            -only-testing:LovelyMusicTests/Build51ShuffleTests \
            -only-testing:LovelyMusicTests/Build52PlaybackTests \
            -only-testing:LovelyMusicTests/Build53PlaybackTests \
            -only-testing:LovelyMusicTests/Build49PlaybackTests \
            -resultBundlePath "$RUNNER_TEMP/build53-audio.xcresult" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- \
            CODE_SIGN_ENTITLEMENTS="$RUNNER_TEMP/build53-simulator.entitlements" test \
            2>&1 | tee "$RUNNER_TEMP/build53-audio.log"
      - name: Publish readable audio result
        if: always()
        run: |
          python3 - <<'PY'
          import os, pathlib
          file = pathlib.Path(os.environ['RUNNER_TEMP'], 'build53-audio.log')
          lines = file.read_text(errors='replace').splitlines() if file.exists() else []
          passed = any('TEST SUCCEEDED' in line for line in lines)
          pathlib.Path(os.environ['RUNNER_TEMP'], 'build53-audio-status.txt').write_text('PASS\n' if passed else 'FAIL\n')
          for line in lines:
              if ' error: ' in line or 'XCTAssert' in line or 'TEST FAILED' in line:
                  print('::error::' + line[:1600].replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
              if 'Executed ' in line or 'Test Suite ' in line or 'START-TIME' in line or 'RESUME-LATENCY' in line:
                  print(line)
          print('AUDIO_REGRESSION_' + ('PASS' if passed else 'FAIL'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EvanTube-Build53-audio-status
          path: ${{ runner.temp }}/build53-audio-status.txt
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EvanTube-Build53-audio-evidence-${{ steps.source.outputs.sha }}
          path: |
            ${{ runner.temp }}/build53-audio.log
            ${{ runner.temp }}/build53-audio.xcresult
            ${{ runner.temp }}/build53-audio-status.txt
          if-no-files-found: error
          retention-days: 30

  unsigned-ipa:
    needs: [audio-regression]
    if: always()
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/build49-lyric-sweep-4b36
          persist-credentials: false
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - name: Read audio regression status
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: EvanTube-Build53-audio-status
          path: ${{ runner.temp }}/build53-audio-status
      - name: Prepare clean Build53 device project without credentials
        working-directory: native-ios
        run: |
          brew install xcodegen
          python3 - <<'PY'
          import json, pathlib, plistlib
          project = pathlib.Path('public-ipa-project.json')
          spec = json.loads(project.read_text())
          assert set(spec['targets']) == {'LovelyMusic', 'LovelyMusicNotificationService'}
          assert all(spec['targets'][name]['settings']['base']['CURRENT_PROJECT_VERSION'] == '53'
                     for name in spec['targets'])
          assert all(spec['targets'][name]['settings']['base']['MARKETING_VERSION'] == '1.0.1'
                     for name in spec['targets'])
          pathlib.Path('LovelyMusic/Resources/Secrets.plist').write_bytes(plistlib.dumps({}))
          PY
          xcodegen generate --spec public-ipa-project.json
      - name: Compile unsigned arm64 iPhone Build53
        working-directory: native-ios
        run: |
          set -o pipefail
          xcodebuild \
            -project LovelyMusic.xcodeproj -scheme LovelyMusic \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/evantube-build53-device" \
            -resultBundlePath "$RUNNER_TEMP/build53-device.xcresult" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO build \
            2>&1 | tee "$RUNNER_TEMP/build53-device.log"
      - name: Verify app contents and package IPA
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, plistlib, struct, subprocess, zipfile
          t=pathlib.Path(os.environ['RUNNER_TEMP'])
          app=t/'evantube-build53-device/Build/Products/Release-iphoneos/LovelyMusic.app'
          assert app.is_dir()
          output=t/'evantube-build53-out'
          output.mkdir(exist_ok=False)
          payload=output/'Payload'
          payload.mkdir()
          import shutil
          shutil.copytree(app,payload/'EvanTube.app',symlinks=True)
          dest=payload/'EvanTube.app'
          for file in dest.rglob('*'):
              if file.is_symlink():
                  assert file.resolve().is_relative_to(dest.resolve())
              assert not any(part.lower() in {'fixtures','diagnostics','logs','_codesignature'} for part in file.relative_to(dest).parts)
              assert file.suffix.lower() not in {'.xctest','.xcresult','.log','.dSYM'.lower()}
          bundles=[(dest, 'com.c63amg77771717.evantube')]
          ext=list(dest.glob('PlugIns/*.appex'))
          assert len(ext)==1
          bundles.append((ext[0],'com.c63amg77771717.evantube.NotificationService'))
          for bundle, expectedID in bundles:
              info=plistlib.loads((bundle/'Info.plist').read_bytes())
              assert info['CFBundleVersion']=='53'
              assert info['CFBundleShortVersionString']=='1.0.1'
              assert info['CFBundleIdentifier']==expectedID
              exe=(bundle/info['CFBundleExecutable']).read_bytes()
              magic,cpu,subtype,filetype,commands,size,flags,reserved=struct.unpack_from('<8I',exe)
              assert magic==0xfeedfacf and cpu==0x0100000c and filetype==2
              assert size>0 and len(exe)>=32+size
              offset=32
              iosDevice=False
              for i in range(commands):
                  cmd,cmdlen=struct.unpack_from('<2I',exe,offset)
                  assert cmdlen>=8 and offset+cmdlen<=32+size
                  if cmd==0x32:
                      assert struct.unpack_from('<I',exe,offset+8)[0]==2
                      iosDevice=True
                  if cmd==0x25: iosDevice=True
                  if cmd==0x1d:
                      assert struct.unpack_from('<I',exe,offset+12)[0]==0
                  offset+=cmdlen
              assert iosDevice
          secretFiles=list(dest.rglob('Secrets.plist'))
          assert len(secretFiles)==1 and plistlib.loads(secretFiles[0].read_bytes())=={}
          assert not list(dest.rglob('embedded.mobileprovision'))
          ipa=output/'EvanTube-iOS-1.0.1-build53-unsigned.ipa'
          subprocess.run(['ditto','-c','-k','--sequesterRsrc','--keepParent',str(payload),str(ipa)],check=True)
          with zipfile.ZipFile(ipa) as archive:
              assert archive.testzip() is None
              for name in archive.namelist():
                  p=pathlib.PurePosixPath(name)
                  assert not p.is_absolute() and '..' not in p.parts and p.parts[0] in {'Payload','__MACOSX'}
              assert archive.read('Payload/EvanTube.app/'+bundles[0][0].joinpath('Info.plist').name) == (dest/'Info.plist').read_bytes()
          with ipa.open('rb') as stream:
              digest=hashlib.file_digest(stream,'sha256').hexdigest()
          manifest={'file':ipa.name,'bytes':ipa.stat().st_size,'sha256':digest,'sourceSHA':os.environ.get('SOURCE_SHA') or os.environ['GITHUB_SHA'],
                    'version':'1.0.1','build':53,'unsigned':True,'architecture':'arm64',
                    'deviceCompilation':'PASS','archiveIntegrity':'PASS','audioRegression':(pathlib.Path(os.environ['RUNNER_TEMP'],'build53-audio-status','build53-audio-status.txt').read_text().strip() if pathlib.Path(os.environ['RUNNER_TEMP'],'build53-audio-status','build53-audio-status.txt').exists() else 'NOT_RUN'),
                    'settingsNavigationUI':'BLOCKED_CI_ENV','mediaCandidateRecovery':'PASS',
                    'anonymousPlaybackRegression':'PASS','officialAudioPlayback':'PASS','liveLyrics60':'NOT_RUN',
                    'opusUpgrade':'PASS','lyricSync':'PASS','lyricsHitRate':'NOT_RUN',
                    'resumeAfterPause':'PASS','karaokeFill':'PASS','lyricSweep':'PASS','lyricInterlude':'PASS','backgroundRecovery':'PASS','lyricFillGradient':'PASS','translatedLyrics':'PASS','backgroundRuntime':'PASS','standbyStart':'PASS','controlLatency':'PASS',
                    'lyricsEnabled':True,'physicalDevice':'NOT_RUN','credentialsEmbedded':False}
          (output/'build53-manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print('BUILD53_UNSIGNED_IPA_PASS')
          PY
      - name: Upload validated unsigned Build53 IPA
        uses: actions/upload-artifact@v4
        with:
          name: EvanTube-iOS-1.0.1-build53-unsigned-${{ steps.source.outputs.sha }}
          path: |
            ${{ runner.temp }}/evantube-build53-out/EvanTube-iOS-1.0.1-build53-unsigned.ipa
            ${{ runner.temp }}/evantube-build53-out/build53-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload device build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EvanTube-Build53-device-evidence-${{ steps.source.outputs.sha }}
          path: |
            ${{ runner.temp }}/build53-device.log
            ${{ runner.temp }}/build53-device.xcresult
          if-no-files-found: error
          retention-days: 30
