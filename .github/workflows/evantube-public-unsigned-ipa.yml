{
  "name": "EvanTube public unsigned IPA",
  "on": {
    "workflow_call": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "unsigned_ipa": {
      "runs-on": "macos-14",
      "timeout-minutes": 60,
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "uses": "maxim-lobanov/setup-xcode@v1",
          "with": {
            "xcode-version": "16.2"
          }
        },
        {
          "name": "Compile and validate credential-free unsigned IPA",
          "run": "python3 scripts/ios-public-ci/build_ipa.py"
        },
        {
          "name": "Upload only validated unsigned IPA and safe manifest",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "EvanTube-iOS-1.0.1-build28-unsigned-${{ github.sha }}",
            "path": "${{ runner.temp }}/evantube-public-ipa/out/EvanTube-iOS-1.0.1-build28-unsigned.ipa\n${{ runner.temp }}/evantube-public-ipa/out/ipa-manifest.json",
            "if-no-files-found": "error",
            "retention-days": 3
          }
        }
      ]
    }
  }
}
