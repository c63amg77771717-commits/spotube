# On master this existing path remains the original Flutter workflow.
# When manually selected with ref=codex/ios-neonoir-20260930, run the
# separate native Build27 synthetic validation and credential-free IPA.
name: EvanTube public synthetic native tests
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: evantube-build27-dispatch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public_synthetic_validation:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reject live inputs and unreviewed test resources
        run: python3 scripts/ios-public-ci/boundary.py preflight
      - name: Verify synthetic leak guards and receipts
        run: python3 scripts/ios-public-ci/boundary_tests.py
      - name: Verify IPA and output privacy policy
        run: python3 scripts/ios-public-ci/ipa_policy_tests.py
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'
      - name: Prepare simulation-only dependencies
        working-directory: native-ios
        run: |
          brew install xcodegen
          cp Secrets.plist.example LovelyMusic/Resources/Secrets.plist
          /usr/libexec/PlistBuddy -c 'Delete :YOUTUBE_DATA_API_KEY' LovelyMusic/Resources/Secrets.plist || true
          python3 - <<'PY'
          import os, pathlib, plistlib
          pathlib.Path(os.environ['RUNNER_TEMP'], 'evantube-simulator.entitlements').write_bytes(plistlib.dumps({
              'application-identifier': 'com.c63amg77771717.evantube',
              'keychain-access-groups': ['com.c63amg77771717.evantube'],
              'get-task-allow': True}))
          PY
      - name: Execute 17 source-replacement synthetic tests
        run: python3 scripts/ios-source-replacement/run_native.py

  unsigned_ipa:
    needs: public_synthetic_validation
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'
      - name: Build and verify credential-free unsigned Build27 IPA
        run: python3 scripts/ios-public-ci/build_ipa.py
      - name: Upload only validated unsigned IPA and safe manifest
        uses: actions/upload-artifact@v4
        with:
          name: EvanTube-iOS-1.0.1-build27-unsigned-${{ github.sha }}
          path: |
            ${{ runner.temp }}/evantube-public-ipa/out/EvanTube-iOS-1.0.1-build27-unsigned.ipa
            ${{ runner.temp }}/evantube-public-ipa/out/ipa-manifest.json
          if-no-files-found: error
          retention-days: 3
