name: EvanTube iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "lib/**"
      - "ios/**"
      - "pubspec.yaml"
      - ".github/workflows/evantube-ios-ipa.yml"

env:
  FLUTTER_VERSION: "3.35.2"
  FLUTTER_CHANNEL: master
  CHANNEL: stable
  DOTENV: |
    LASTFM_API_KEY=evantube
    LASTFM_API_SECRET=evantube
    HIDE_DONATIONS=1
    ENABLE_UPDATE_CHECK=0

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.18.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
          git-source: https://github.com/flutter/flutter.git

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - name: Install iOS dependencies
        run: |
          flutter pub get
          dart cli/cli.dart install-dependencies --platform=ios --arch=all

      - name: Build unsigned iOS IPA
        run: dart cli/cli.dart build --arch=all ios

      - name: Rename IPA
        shell: bash
        run: |
          set -euo pipefail
          test -f Spotube-iOS.ipa
          mv Spotube-iOS.ipa EvanTube-iOS.ipa
          shasum -a 256 EvanTube-iOS.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: EvanTube-iOS
          path: EvanTube-iOS.ipa
          if-no-files-found: error
          retention-days: 14
